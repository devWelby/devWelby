<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Wellington Barboza — Desenvolvimento back-end</title>
  <desc id="desc">Banner escuro com detalhes em violeta e um terminal ilustrado. Python, PHP, APIs e automação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10111D"/><stop offset="1" stop-color="#17132C"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/><stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A78BFA" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#343047"/>
  <rect x="72" y="62" width="40" height="4" rx="2" fill="url(#accent)"/>
  <text x="128" y="70" font-family="Consolas, monospace" font-size="16" letter-spacing="3" fill="#C4B5FD">DEVWELBY</text>
  <text x="72" y="139" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#F8FAFC">Wellington Barboza</text>
  <text x="74" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#D9D6E9">Desenvolvimento back-end</text>
  <text x="74" y="223" font-family="Consolas, monospace" font-size="18" fill="#A9A5BD">Python / PHP / APIs / Automação</text>
  <rect x="792" y="64" width="336" height="190" rx="12" fill="#0D0F18" stroke="#3B3552"/>
  <path d="M792 101H1128" stroke="#302B42"/>
  <circle cx="814" cy="83" r="4" fill="#A78BFA"/>
  <circle cx="830" cy="83" r="4" fill="#726285"/>
  <circle cx="846" cy="83" r="4" fill="#4E465E"/>
  <g font-family="Consolas, monospace" font-size="16">
    <text x="816" y="136" fill="#C4B5FD">$ construir</text>
    <text x="816" y="167" fill="#E2E8F0">  ideia → código</text>
    <text x="816" y="198" fill="#E2E8F0">  código → solução</text>
    <text x="816" y="231" fill="#67E8F9">✓ evoluir a cada entrega</text>
  </g>
  <rect x="72" y="278" width="1056" height="2" rx="1" fill="url(#accent)" opacity=".65"/>
</svg>
